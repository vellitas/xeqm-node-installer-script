# nginx virtual host for bootstrap.xeqmlabs.com
# Place at: /etc/nginx/sites-available/bootstrap.xeqmlabs.com
# Enable:   sudo ln -s /etc/nginx/sites-available/bootstrap.xeqmlabs.com \
#                      /etc/nginx/sites-enabled/
#
# Requires Cloudflare origin certs — see SETUP.md for cert paths.
# All endpoints served with no-store to prevent CDN caching stale bootstrap data.

server {
    listen 80;
    server_name bootstrap.xeqmlabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bootstrap.xeqmlabs.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cloudflare origin pull verification (rejects direct connections bypassing CF)
    include snippets/cloudflare-auth-pull.conf;
    include snippets/cloudflare-real-ip.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    root /var/www/bootstrap;
    autoindex off;
    index index.html;

    location = / {
        add_header Cache-Control 'no-store';
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control 'no-store';
        try_files $uri =404;
    }

    location = /lmdb.tar.gz {
        add_header Cache-Control 'no-store';
        try_files $uri =404;
    }

    location = /lmdb.tar.gz.sha256 {
        add_header Cache-Control 'no-store';
        add_header Content-Type 'text/plain';
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control 'no-store';
        add_header Content-Type application/json;
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/bootstrap-access.log;
    error_log  /var/log/nginx/bootstrap-error.log warn;
}
